<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2048 — Tile Puzzle Game</title>
  <meta name="description" content="Play 2048 — slide and merge matching number tiles on a 4x4 grid to reach the 2048 tile." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f6f3ec;
      --bg-surface: #ede7db;
      --bg-board: #b9ada1;
      --bg-cell: rgba(238, 228, 218, 0.36);
      --text-primary: #3d352e;
      --text-secondary: #7a6e63;
      --text-muted: #9c8f82;
      --btn-bg: #8f7a66;
      --btn-bg-hover: #7c6855;
      --btn-text: #f9f6f2;
      --btn-secondary-bg: #e2d9c8;
      --btn-secondary-hover: #d5c9b4;
      --btn-secondary-text: #4a4037;
      --shadow-board: 0 12px 32px -8px rgba(61, 53, 46, 0.16), 0 2px 6px rgba(61, 53, 46, 0.08);
      --shadow-tile: 0 3px 6px rgba(61, 53, 46, 0.14);
      --overlay-bg: rgba(246, 243, 236, 0.84);
      --board-size: min(88vw, 440px);
      --grid-gap: 12px;
      --board-padding: 12px;
      --cell-size: calc((var(--board-size) - (var(--board-padding) * 2) - (var(--grid-gap) * 3)) / 4);
      --radius-board: 14px;
      --radius-tile: 8px;
    }

    [data-theme="dark"] {
      --bg-page: #181614;
      --bg-surface: #25221f;
      --bg-board: #332e2a;
      --bg-cell: rgba(255, 248, 240, 0.07);
      --text-primary: #f4efe8;
      --text-secondary: #b5aaa0;
      --text-muted: #847a70;
      --btn-bg: #c88a4b;
      --btn-bg-hover: #d99b5c;
      --btn-text: #181614;
      --btn-secondary-bg: #2f2b27;
      --btn-secondary-hover: #3c3732;
      --btn-secondary-text: #e6dfd5;
      --shadow-board: 0 16px 40px -8px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-tile: 0 4px 10px rgba(0, 0, 0, 0.35);
      --overlay-bg: rgba(24, 22, 20, 0.86);
    }

    @media (max-width: 420px) {
      :root {
        --board-size: min(92vw, 360px);
        --grid-gap: 9px;
        --board-padding: 9px;
        --radius-board: 12px;
        --radius-tile: 6px;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 36px;
    }

    .game-wrapper {
      width: var(--board-size);
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header: Title + Scoreboxes */
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    h1.game-title {
      font-size: clamp(2.4rem, 7vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text-primary);
      user-select: none;
    }

    .game-subtitle {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .game-subtitle strong {
      font-weight: 700;
      color: var(--text-primary);
    }

    .scores-container {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .score-box {
      position: relative;
      background: var(--bg-surface);
      padding: 8px 14px;
      border-radius: 10px;
      min-width: 78px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      user-select: none;
      transition: background-color 0.25s ease;
    }

    .score-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }

    .score-value {
      font-size: 1.25rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      line-height: 1.2;
      margin-top: 2px;
    }

    .score-addition {
      position: absolute;
      right: 12px;
      top: 4px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #d97724;
      pointer-events: none;
      animation: scoreFloat 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes scoreFloat {
      0% {
        opacity: 1;
        transform: translateY(8px) scale(0.9);
      }
      100% {
        opacity: 0;
        transform: translateY(-22px) scale(1.05);
      }
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, background-color 0.18s ease, opacity 0.18s ease;
      user-select: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--btn-bg);
      color: var(--btn-text);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--btn-bg-hover);
    }

    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--btn-secondary-hover);
    }

    .btn-icon {
      padding: 10px;
      width: 38px;
      height: 38px;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Game Board */
    .board-container {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
      background-color: var(--bg-board);
      border-radius: var(--radius-board);
      padding: var(--board-padding);
      box-shadow: var(--shadow-board);
      touch-action: none;
      user-select: none;
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }

    .grid-background {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: var(--grid-gap);
      width: 100%;
      height: 100%;
    }

    .grid-cell {
      background-color: var(--bg-cell);
      border-radius: var(--radius-tile);
      width: 100%;
      height: 100%;
    }

    .tile-layer {
      position: absolute;
      top: var(--board-padding);
      left: var(--board-padding);
      right: var(--board-padding);
      bottom: var(--board-padding);
      pointer-events: none;
    }

    .tile {
      position: absolute;
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: var(--radius-tile);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      box-shadow: var(--shadow-tile);
      transition: transform 115ms cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      z-index: 1;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-tile);
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .tile-new .tile-inner {
      animation: tileAppear 180ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
      animation-delay: 50ms;
    }

    .tile-merged {
      z-index: 2;
    }

    .tile-merged .tile-inner {
      animation: tilePop 200ms cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    @keyframes tileAppear {
      0% {
        opacity: 0;
        transform: scale(0.35);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes tilePop {
      0% {
        transform: scale(0.88);
      }
      45% {
        transform: scale(1.16);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Tile Color Palette & Typography Scaling */
    .tile-2 .tile-inner    { background: #eee4da; color: #595047; font-size: clamp(1.6rem, 5.5vw, 2.15rem); }
    .tile-4 .tile-inner    { background: #ede0c8; color: #595047; font-size: clamp(1.6rem, 5.5vw, 2.15rem); }
    .tile-8 .tile-inner    { background: #f2b179; color: #f9f6f2; font-size: clamp(1.6rem, 5.5vw, 2.15rem); }
    .tile-16 .tile-inner   { background: #f59563; color: #f9f6f2; font-size: clamp(1.5rem, 5.2vw, 2rem); }
    .tile-32 .tile-inner   { background: #f67c5f; color: #f9f6f2; font-size: clamp(1.5rem, 5.2vw, 2rem); }
    .tile-64 .tile-inner   { background: #f65e3b; color: #f9f6f2; font-size: clamp(1.5rem, 5.2vw, 2rem); }
    .tile-128 .tile-inner  { background: #edcf72; color: #f9f6f2; font-size: clamp(1.3rem, 4.5vw, 1.75rem); box-shadow: 0 0 18px rgba(243, 215, 116, 0.28); }
    .tile-256 .tile-inner  { background: #edcc61; color: #f9f6f2; font-size: clamp(1.3rem, 4.5vw, 1.75rem); box-shadow: 0 0 20px rgba(243, 215, 116, 0.36); }
    .tile-512 .tile-inner  { background: #edc850; color: #f9f6f2; font-size: clamp(1.3rem, 4.5vw, 1.75rem); box-shadow: 0 0 22px rgba(243, 215, 116, 0.44); }
    .tile-1024 .tile-inner { background: #edc53f; color: #f9f6f2; font-size: clamp(1.08rem, 3.8vw, 1.45rem); box-shadow: 0 0 24px rgba(243, 215, 116, 0.52); }
    .tile-2048 .tile-inner { background: #edc22e; color: #f9f6f2; font-size: clamp(1.08rem, 3.8vw, 1.45rem); box-shadow: 0 0 28px rgba(243, 215, 116, 0.65); }
    .tile-super .tile-inner { background: #2d2926; color: #f9f6f2; font-size: clamp(0.95rem, 3.4vw, 1.3rem); }

    [data-theme="dark"] .tile-2 .tile-inner  { background: #4a433d; color: #f4efe8; }
    [data-theme="dark"] .tile-4 .tile-inner  { background: #5c5146; color: #f4efe8; }
    [data-theme="dark"] .tile-super .tile-inner { background: #d97724; color: #181614; }

    /* Overlay (Game Over / You Win) */
    .game-overlay {
      position: absolute;
      inset: 0;
      background-color: var(--overlay-bg);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: var(--radius-board);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .game-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: clamp(1.85rem, 6vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .overlay-subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Footer / Instructions */
    .footer-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.84rem;
      line-height: 1.5;
      color: var(--text-secondary);
      padding-top: 4px;
    }

    .kbd-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--bg-surface);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .kbd-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--bg-page);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.74rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <main class="game-wrapper">
    <header class="header-top">
      <div class="brand">
        <h1 class="game-title">2048</h1>
        <p class="game-subtitle">Join the numbers to reach <strong>2048</strong></p>
      </div>
      <div class="scores-container">
        <div class="score-box" id="score-box" aria-live="polite">
          <span class="score-label">Score</span>
          <span class="score-value" id="score-value">0</span>
        </div>
        <div class="score-box" id="best-box">
          <span class="score-label">Best</span>
          <span class="score-value" id="best-value">0</span>
        </div>
      </div>
    </header>

    <section class="controls-bar" aria-label="Game controls">
      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="undo-btn" title="Undo last move (Z)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
          </svg>
          Undo
        </button>
        <button type="button" class="btn btn-secondary btn-icon" id="theme-btn" title="Toggle Dark/Light Theme" aria-label="Toggle Dark/Light Theme">
          <svg id="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" style="display: none;">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
          <svg id="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
      </div>
      <button type="button" class="btn btn-primary" id="new-game-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 16h5v5" />
        </svg>
        New Game
      </button>
    </section>

    <section class="board-container" id="board-container" aria-label="2048 Game Board">
      <div class="grid-background" aria-hidden="true">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      </div>

      <div class="tile-layer" id="tile-layer"></div>

      <div class="game-overlay" id="game-overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <h2 class="overlay-title" id="overlay-title">Game Over</h2>
        <p class="overlay-subtitle" id="overlay-subtitle">No more moves available.</p>
        <div class="overlay-actions">
          <button type="button" class="btn btn-secondary" id="overlay-keep-playing-btn" style="display: none;">
            Keep Playing
          </button>
          <button type="button" class="btn btn-secondary" id="overlay-undo-btn">
            Undo Move
          </button>
          <button type="button" class="btn btn-primary" id="overlay-restart-btn">
            Try Again
          </button>
        </div>
      </div>
    </section>

    <footer class="footer-info">
      <div class="kbd-hint">
        <span>Use <span class="kbd-badge">↑</span><span class="kbd-badge">↓</span><span class="kbd-badge">←</span><span class="kbd-badge">→</span>, <span class="kbd-badge">WASD</span>, or <strong>swipe</strong> to move tiles.</span>
        <span>Press <span class="kbd-badge">Z</span> to undo.</span>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      const GRID_SIZE = 4;
      const STORAGE_KEY_STATE = 'noxwell_2048_state_v1';
      const STORAGE_KEY_BEST = 'noxwell_2048_best_v1';
      const STORAGE_KEY_THEME = 'noxwell_2048_theme_v1';
      const MAX_HISTORY = 25;

      const tileLayer = document.getElementById('tile-layer');
      const scoreValueEl = document.getElementById('score-value');
      const bestValueEl = document.getElementById('best-value');
      const scoreBoxEl = document.getElementById('score-box');
      const undoBtn = document.getElementById('undo-btn');
      const newGameBtn = document.getElementById('new-game-btn');
      const themeBtn = document.getElementById('theme-btn');
      const themeIconSun = document.getElementById('theme-icon-sun');
      const themeIconMoon = document.getElementById('theme-icon-moon');
      const boardContainer = document.getElementById('board-container');

      const gameOverlay = document.getElementById('game-overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlaySubtitle = document.getElementById('overlay-subtitle');
      const overlayKeepPlayingBtn = document.getElementById('overlay-keep-playing-btn');
      const overlayUndoBtn = document.getElementById('overlay-undo-btn');
      const overlayRestartBtn = document.getElementById('overlay-restart-btn');

      let nextTileId = 1;
      let board = []; // 4x4 array of null or { id, value, row, col, previousPosition, mergedFrom, isNew }
      let score = 0;
      let bestScore = 0;
      let hasWon = false;
      let keepPlaying = false;
      let isGameOver = false;
      let history = [];

      // Theme Initialization
      function initTheme() {
        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');
        applyTheme(theme);
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeIconSun.style.display = 'block';
          themeIconMoon.style.display = 'none';
        } else {
          document.documentElement.removeAttribute('data-theme');
          themeIconSun.style.display = 'none';
          themeIconMoon.style.display = 'block';
        }
        try {
          localStorage.setItem(STORAGE_KEY_THEME, theme);
        } catch (_) {}
      }

      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        applyTheme(isDark ? 'light' : 'dark');
      });

      // Helper to create an empty 4x4 grid
      function createEmptyGrid() {
        return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
      }

      function getEmptyCells() {
        const cells = [];
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (!board[r][c]) cells.push({ r, c });
          }
        }
        return cells;
      }

      function spawnRandomTile() {
        const empty = getEmptyCells();
        if (empty.length === 0) return false;
        const { r, c } = empty[Math.floor(Math.random() * empty.length)];
        const value = Math.random() < 0.9 ? 2 : 4;
        board[r][c] = {
          id: nextTileId++,
          value,
          row: r,
          col: c,
          previousPosition: null,
          mergedFrom: null,
          isNew: true
        };
        return true;
      }

      function serializeBoard(grid) {
        return grid.map(row => row.map(cell => (cell ? cell.value : 0)));
      }

      function restoreBoardFromValues(valuesGrid) {
        const restored = createEmptyGrid();
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const val = valuesGrid[r]?.[c] || 0;
            if (val > 0) {
              restored[r][c] = {
                id: nextTileId++,
                value: val,
                row: r,
                col: c,
                previousPosition: null,
                mergedFrom: null,
                isNew: false
              };
            }
          }
        }
        return restored;
      }

      function saveGameState() {
        try {
          localStorage.setItem(STORAGE_KEY_BEST, String(bestScore));
          const payload = {
            grid: serializeBoard(board),
            score,
            hasWon,
            keepPlaying,
            isGameOver,
            history
          };
          localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(payload));
        } catch (_) {}
      }

      function loadGameState() {
        try {
          const savedBest = parseInt(localStorage.getItem(STORAGE_KEY_BEST) || '0', 10);
          if (!Number.isNaN(savedBest) && savedBest > 0) {
            bestScore = savedBest;
          }
          const raw = localStorage.getItem(STORAGE_KEY_STATE);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data || !Array.isArray(data.grid) || data.grid.length !== GRID_SIZE) return false;

          board = restoreBoardFromValues(data.grid);
          score = Number(data.score) || 0;
          if (score > bestScore) bestScore = score;
          hasWon = Boolean(data.hasWon);
          keepPlaying = Boolean(data.keepPlaying);
          isGameOver = Boolean(data.isGameOver);
          history = Array.isArray(data.history) ? data.history.slice(-MAX_HISTORY) : [];
          return true;
        } catch (_) {
          return false;
        }
      }

      function startNewGame() {
        board = createEmptyGrid();
        score = 0;
        hasWon = false;
        keepPlaying = false;
        isGameOver = false;
        history = [];
        spawnRandomTile();
        spawnRandomTile();
        saveGameState();
        render(0);
      }

      function prepareTilesForMove() {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const tile = board[r][c];
            if (tile) {
              tile.previousPosition = { row: r, col: c };
              tile.mergedFrom = null;
              tile.isNew = false;
            }
          }
        }
      }

      function getVectors(direction) {
        const map = {
          up:    { dr: -1, dc: 0 },
          right: { dr: 0,  dc: 1 },
          down:  { dr: 1,  dc: 0 },
          left:  { dr: 0,  dc: -1 }
        };
        return map[direction];
      }

      function buildTraversals(vector) {
        const rows = [0, 1, 2, 3];
        const cols = [0, 1, 2, 3];
        if (vector.dr === 1) rows.reverse();
        if (vector.dc === 1) cols.reverse();
        return { rows, cols };
      }

      function isWithinBounds(r, c) {
        return r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE;
      }

      function findFarthestPosition(r, c, vector) {
        let prevR = r;
        let prevC = c;
        let nextR = r + vector.dr;
        let nextC = c + vector.dc;

        while (isWithinBounds(nextR, nextC) && !board[nextR][nextC]) {
          prevR = nextR;
          prevC = nextC;
          nextR += vector.dr;
          nextC += vector.dc;
        }

        return {
          farthest: { r: prevR, c: prevC },
          next: isWithinBounds(nextR, nextC) ? { r: nextR, c: nextC } : null
        };
      }

      function canMakeAnyMove() {
        if (getEmptyCells().length > 0) return true;
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const current = board[r][c];
            if (!current) continue;
            if (r + 1 < GRID_SIZE && board[r + 1][c] && board[r + 1][c].value === current.value) return true;
            if (c + 1 < GRID_SIZE && board[r][c + 1] && board[r][c + 1].value === current.value) return true;
          }
        }
        return false;
      }

      function move(direction) {
        if (isGameOver || (hasWon && !keepPlaying)) return false;

        const vector = getVectors(direction);
        if (!vector) return false;

        const snapshot = {
          grid: serializeBoard(board),
          score,
          hasWon,
          keepPlaying
        };

        prepareTilesForMove();
        const traversals = buildTraversals(vector);
        let moved = false;
        let pointsGained = 0;

        for (const r of traversals.rows) {
          for (const c of traversals.cols) {
            const tile = board[r][c];
            if (!tile) continue;

            const positions = findFarthestPosition(r, c, vector);
            const nextPos = positions.next;
            const nextTile = nextPos ? board[nextPos.r][nextPos.c] : null;

            if (nextTile && nextTile.value === tile.value && !nextTile.mergedFrom) {
              // Merge into nextPos
              const mergedValue = tile.value * 2;
              const mergedTile = {
                id: nextTileId++,
                value: mergedValue,
                row: nextPos.r,
                col: nextPos.c,
                previousPosition: null,
                mergedFrom: [tile, nextTile],
                isNew: false
              };

              tile.row = nextPos.r;
              tile.col = nextPos.c;

              board[r][c] = null;
              board[nextPos.r][nextPos.c] = mergedTile;

              pointsGained += mergedValue;
              if (mergedValue === 2048 && !hasWon) {
                hasWon = true;
              }
              moved = true;
            } else {
              const targetR = positions.farthest.r;
              const targetC = positions.farthest.c;
              if (targetR !== r || targetC !== c) {
                board[r][c] = null;
                tile.row = targetR;
                tile.col = targetC;
                board[targetR][targetC] = tile;
                moved = true;
              }
            }
          }
        }

        if (!moved) return false;

        history.push(snapshot);
        if (history.length > MAX_HISTORY) {
          history.shift();
        }

        score += pointsGained;
        if (score > bestScore) {
          bestScore = score;
        }

        spawnRandomTile();

        if (!canMakeAnyMove()) {
          isGameOver = true;
        }

        saveGameState();
        render(pointsGained);
        return true;
      }

      function undoLastMove() {
        if (history.length === 0) return;
        const last = history.pop();
        board = restoreBoardFromValues(last.grid);
        score = last.score;
        hasWon = last.hasWon;
        keepPlaying = last.keepPlaying;
        isGameOver = false;
        saveGameState();
        render(0);
      }

      // Compute pixel transform for row/col using live CSS variables
      function getTileTransform(row, col) {
        return `translate(calc(${col} * (var(--cell-size) + var(--grid-gap))), calc(${row} * (var(--cell-size) + var(--grid-gap))))`;
      }

      function getTileClass(value) {
        return value <= 2048 ? `tile-${value}` : 'tile-super';
      }

      function createTileElement(tileObj, initialRow, initialCol, extraClass = '') {
        const el = document.createElement('div');
        el.className = `tile ${getTileClass(tileObj.value)} ${extraClass}`.trim();
        el.style.transform = getTileTransform(initialRow, initialCol);

        const inner = document.createElement('div');
        inner.className = 'tile-inner';
        inner.textContent = String(tileObj.value);
        el.appendChild(inner);

        return el;
      }

      function render(pointsDelta = 0) {
        // Update scores
        scoreValueEl.textContent = score.toLocaleString();
        bestValueEl.textContent = bestScore.toLocaleString();
        undoBtn.disabled = history.length === 0;

        if (pointsDelta > 0) {
          const floatEl = document.createElement('div');
          floatEl.className = 'score-addition';
          floatEl.textContent = `+${pointsDelta}`;
          scoreBoxEl.appendChild(floatEl);
          setTimeout(() => floatEl.remove(), 650);
        }

        // Render tiles with slide + merge animations
        tileLayer.innerHTML = '';
        const animatedMoves = [];

        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const tile = board[r][c];
            if (!tile) continue;

            if (tile.mergedFrom) {
              // Render the two source tiles sliding into the merged position
              for (const source of tile.mergedFrom) {
                const startR = source.previousPosition ? source.previousPosition.row : r;
                const startC = source.previousPosition ? source.previousPosition.col : c;
                const sourceEl = createTileElement(source, startR, startC);
                tileLayer.appendChild(sourceEl);
                if (startR !== r || startC !== c) {
                  animatedMoves.push({ el: sourceEl, targetR: r, targetC: c });
                }
              }
              // Render the merged tile with pop animation
              const mergedEl = createTileElement(tile, r, c, 'tile-merged');
              tileLayer.appendChild(mergedEl);
            } else {
              const startR = tile.previousPosition ? tile.previousPosition.row : r;
              const startC = tile.previousPosition ? tile.previousPosition.col : c;
              const extra = tile.isNew ? 'tile-new' : '';
              const tileEl = createTileElement(tile, startR, startC, extra);
              tileLayer.appendChild(tileEl);
              if (startR !== r || startC !== c) {
                animatedMoves.push({ el: tileEl, targetR: r, targetC: c });
              }
            }
          }
        }

        if (animatedMoves.length > 0) {
          // Force layout so browser registers initial transform before sliding to target
          void tileLayer.offsetWidth;
          for (const item of animatedMoves) {
            item.el.style.transform = getTileTransform(item.targetR, item.targetC);
          }
        }

        // Update Win / Game Over Overlay
        if (hasWon && !keepPlaying) {
          overlayTitle.textContent = 'You Win!';
          overlaySubtitle.textContent = `You reached the 2048 tile with a score of ${score.toLocaleString()}!`;
          overlayKeepPlayingBtn.style.display = 'inline-flex';
          overlayUndoBtn.style.display = 'none';
          gameOverlay.classList.add('active');
        } else if (isGameOver) {
          overlayTitle.textContent = 'Game Over';
          overlaySubtitle.textContent = `Final score: ${score.toLocaleString()}`;
          overlayKeepPlayingBtn.style.display = 'none';
          overlayUndoBtn.style.display = history.length > 0 ? 'inline-flex' : 'none';
          gameOverlay.classList.add('active');
        } else {
          gameOverlay.classList.remove('active');
        }
      }

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.altKey || e.metaKey) return;

        const keyMap = {
          ArrowUp: 'up',
          KeyW: 'up',
          KeyK: 'up',
          ArrowRight: 'right',
          KeyD: 'right',
          KeyL: 'right',
          ArrowDown: 'down',
          KeyS: 'down',
          KeyJ: 'down',
          ArrowLeft: 'left',
          KeyA: 'left',
          KeyH: 'left'
        };

        if (keyMap[e.code]) {
          e.preventDefault();
          move(keyMap[e.code]);
        } else if (e.code === 'KeyZ') {
          e.preventDefault();
          undoLastMove();
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          startNewGame();
        }
      });

      // Touch & Pointer Swipe Controls
      let touchStartX = 0;
      let touchStartY = 0;
      let isSwiping = false;

      boardContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        isSwiping = true;
      }, { passive: true });

      boardContainer.addEventListener('touchmove', (e) => {
        if (isSwiping) {
          e.preventDefault();
        }
      }, { passive: false });

      boardContainer.addEventListener('touchend', (e) => {
        if (!isSwiping || e.changedTouches.length === 0) return;
        isSwiping = false;

        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (Math.max(absDx, absDy) > 26) {
          if (absDx > absDy) {
            move(dx > 0 ? 'right' : 'left');
          } else {
            move(dy > 0 ? 'down' : 'up');
          }
        }
      }, { passive: true });

      // Button Listeners
      newGameBtn.addEventListener('click', () => startNewGame());
      undoBtn.addEventListener('click', () => undoLastMove());
      overlayRestartBtn.addEventListener('click', () => startNewGame());
      overlayUndoBtn.addEventListener('click', () => undoLastMove());
      overlayKeepPlayingBtn.addEventListener('click', () => {
        keepPlaying = true;
        saveGameState();
        render(0);
      });

      // Bootstrap
      initTheme();
      if (!loadGameState()) {
        startNewGame();
      } else {
        render(0);
      }
    })();
  </script>
</body>
</html>
